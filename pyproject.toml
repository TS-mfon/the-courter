[project]
name = "the-courter"
version = "0.1.0"
description = "Autonomous AI civil arbitration protocol on GenLayer"
requires-python = ">=3.11"
dependencies = [
  "eth-abi>=5.0.0",
  "eth-account>=0.13.0",
  "eth-utils>=5.0.0",
  "fastapi>=0.111.0",
  "genlayer-py>=0.0.13",
  "httpx>=0.27.0",
  "pypdf>=5.4.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.4.0",
  "pytesseract>=0.3.13",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
  "pillow>=10.4.0",
  "uvicorn>=0.30.0",
  "web3>=7.0.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
  ".",
  "packages/shared/python"
]
include = [
  "apps.api*",
  "courter_shared*"
]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "packages/shared/python"
]
testpaths = ["tests"]
